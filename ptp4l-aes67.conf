# aes67-tx: PTP slave (slave-only) for the AES67/Dante clock domain.
#
# Reference: README.md "Setting up the PTP slave".
# - The interface is passed on the command line / in the unit (-i eth0).
# - Adjust domainNumber to match your grandmaster (Dante/AES67 usually = 0).
# - If the grandmaster only answers *unicast* delay requests (a common Dante
#   behaviour, evident when ptp4l stays "UNCALIBRATED"), uncomment hybrid_e2e.
[global]
domainNumber        0
network_transport    UDPv4
delay_mechanism     E2E
# hybrid_e2e          1
